# Treasure Runner World Generator Config
# Configuration with switches placed away from portals

[metadata]
name=Switches Away From Portals World
seed=42

[world]
num_rooms=8
difficulty=6

[room]
width=20
height=15
width_variance=2
height_variance=2

[portals]
portals_per_room=3
portals_variance=1
portal_placement=walls
connectivity_chance=30

[treasures]
treasures_per_room=9
treasures_variance=0
treasure_types=1

[pushables]
pushables_per_room=5
pushables_variance=1

[switches]
# Enable switches
enabled=true
# Ensure switches are not placed directly in front of portals
ensure_switch_reachability=true

[charset]
wall=#
floor=.
player=@
pushable=O
treasure=$
portal=X
switch_off=S
switch_on=T
